<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="วางแผนติวสอบปลายภาคอัตโนมัติจากตารางเรียนและตารางสอบ">
<meta name="theme-color" content="#1d6b55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sand2Pharm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sand To Pharmacist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow column like a student's planner — date strip, then a single day timeline; other tabs are tables. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --line:#dde3e0; --fg:#17211d; --muted:#5c6b65;
  --accent:#1d6b55; --accent-soft:#e1efe9; --warn:#b4541c; --warn-soft:#fbeadf; --exam:#a8243b; --exam-soft:#f9e3e7; --olive:#5f6b1f; --sand:#94701f;
  --c0:#2f7d4a; --c1:#6a9a2c; --c2:#3653b0; --c3:#8a3fa0; --c4:#b0602a; --c5:#b03a6b; --c6:#1f7f8f; --c7:#a38415; --c8:#7a5a2e; --c9:#5b6abf; --c10:#2a8f6f; --c11:#9c4a3a;
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2320; --line:#2c3833; --fg:#e6ece9; --muted:#97a69f;
  --accent:#5cc49f; --accent-soft:#1d3a30; --warn:#f0965e; --warn-soft:#3a2518; --exam:#f27b91; --exam-soft:#3d1c24; --olive:#b9c46a; --sand:#e3c46e;
  --c0:#6cc48a; --c1:#a6cc5c; --c2:#8ea4f2; --c3:#cf8de2; --c4:#eba06a; --c5:#ee84b0; --c6:#5fc6d6; --c7:#e0c454; --c8:#d1ab78; --c9:#a9b3f0; --c10:#66d1ac; --c11:#ee9a86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2320; --line:#2c3833; --fg:#e6ece9; --muted:#97a69f;
  --accent:#5cc49f; --accent-soft:#1d3a30; --warn:#f0965e; --warn-soft:#3a2518; --exam:#f27b91; --exam-soft:#3d1c24; --olive:#b9c46a; --sand:#e3c46e;
  --c0:#6cc48a; --c1:#a6cc5c; --c2:#8ea4f2; --c3:#cf8de2; --c4:#eba06a; --c5:#ee84b0; --c6:#5fc6d6; --c7:#e0c454; --c8:#d1ab78; --c9:#a9b3f0; --c10:#66d1ac; --c11:#ee9a86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.brand{display:flex;align-items:center;gap:12px}
.logo{width:96px;height:96px;border-radius:22px;flex:0 0 auto}
.brand h1{color:var(--olive)}
.tagline{margin:4px 0 0;font-family:var(--display);font-style:italic;font-weight:500;font-size:1.08rem;line-height:1.45;color:var(--sand);text-wrap:balance}
.tagline .leaf{display:inline-block;width:64px;height:16px;vertical-align:middle;margin-left:6px;color:var(--sand)}
@media (max-width:480px){.tagline{font-size:.95rem}.tagline .leaf{width:44px}}
@media (max-width:480px){.logo{width:76px;height:76px;border-radius:18px}}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font-family:var(--display);font-size:2.4rem;color:var(--exam);line-height:1}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:500 .95rem var(--body);background:none;border:0;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg)}
.banner.info{background:var(--accent-soft)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;text-align:center;cursor:pointer;color:var(--fg)}
.day .dw{font-size:.75rem;color:var(--muted)}
.day .dn{font-family:var(--display);font-weight:600;font-size:1.1rem}
.day .dots{display:flex;justify-content:center;gap:2px;height:6px;margin-top:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted)}
.day.exam{border-color:var(--exam)}
.day.exam .dn{color:var(--exam)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day[aria-pressed="true"] .dw{color:var(--bg)}
.day[aria-pressed="true"] .dn{color:var(--bg)}
.timeline{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;padding:12px 14px;border-radius:12px}
.row .t{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding-top:2px}
.row .main{min-width:0}
.row.cls{opacity:.7;padding-block:8px;border:1px dashed var(--line)}
.row.cls .title{font-weight:400}
.row.cls.off{opacity:.45}.row.cls.off .title{text-decoration:line-through}
.btn.sm{padding:3px 10px;font-size:.8rem}
.step{display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-size:1rem}
.step b{font-family:var(--mono);min-width:1.5em;text-align:center}
.edit{margin-top:6px;font-size:.85rem}
.edit summary{cursor:pointer;color:var(--muted);width:max-content}
.daytools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.capgrid label{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.capgrid input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%}
.addbox{border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.addbox summary{cursor:pointer;color:var(--accent);font-weight:500}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.form select,.form input,.krow select,.krow input{font:inherit;font-size:.88rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
.klist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.krow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.krow .grow{flex:1 1 160px}
.dayhead{font-family:var(--display);font-weight:600;padding-top:12px;padding-bottom:2px}
.row.examrow{background:var(--exam-soft);border:2px solid var(--exam)}
.row.examrow .title{color:var(--exam)}
.row.study{--sc:var(--muted);background:color-mix(in srgb,var(--sc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 35%,var(--line))}
.row.study .t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0;color:var(--fg)}
.row.study .t b{font-size:1.05rem;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--sc);color:var(--surface)}
.row.study .t span{font-size:.78rem;color:var(--muted);padding-left:8px}
.row.study .title{font-size:1.05rem}
.row.study .chip{color:var(--fg);font-weight:500}
.kind.learn{background:var(--surface);color:var(--fg)}
.kind.practice{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.kind.mock{background:var(--exam);color:var(--surface);border-color:var(--exam)}
.row.study.done{background:var(--accent-soft);border:2px solid var(--accent)}
.row.study.done .t b{background:var(--accent)}
.row.study.done .title{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.row.study.done .chip .sw{background:var(--accent)!important}
.donebadge{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:600;color:var(--accent);margin-top:4px}
.row.study.missed{border:2px dashed var(--warn)}
.row.study.moved{opacity:.55;border:1px dashed var(--line);background:var(--surface)}
.row.missed .t span{color:var(--warn)}
.title{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-family:var(--mono);color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;display:inline-block}
.kind{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.kind.eve{border-color:var(--exam);color:var(--exam)}
.tip{font-size:.85rem;color:var(--muted);margin-top:2px}
.check{width:46px;height:46px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--sc,var(--muted)) 55%,var(--line));background:var(--surface);cursor:pointer;color:color-mix(in srgb,var(--muted) 40%,transparent);display:grid;place-items:center;transition:transform .15s}
.check svg{width:24px;height:24px}
.check:hover{transform:scale(1.06)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.rate{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.rate button{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.recall{display:flex;flex-direction:column;gap:6px}
.recall label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.recall input{margin-top:5px;accent-color:var(--accent)}
.section{display:flex;flex-direction:column;gap:10px}
.empty{padding:16px 0;color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:.78rem;letter-spacing:.02em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td input,td select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
td input[type=number]{width:56px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.ok{color:var(--accent)} .bad{color:var(--warn);font-weight:600}
.planday{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.planday .chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.pchip.ex{border-color:var(--exam);color:var(--exam);background:var(--exam-soft)}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.wcol{display:flex;flex-direction:column;gap:6px}
.wcol h3{font-size:.95rem}
.wc{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font-size:.8rem}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.settings input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:112px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.82rem}
@media (max-width:480px){.row{grid-template-columns:70px 1fr auto;gap:8px;padding-inline:10px}.row.study .t b{font-size:.95rem;padding:2px 6px}.planday{grid-template-columns:72px 1fr}}
.welcome{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.welcome ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.addsub{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.addsub label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.addsub input,.addsub select,.bk textarea{font:inherit;font-size:.9rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.addsub .wide{grid-column:1/-1}
.bk{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.bk textarea{font-family:var(--mono);font-size:.75rem;height:84px;resize:vertical;word-break:break-all}
.bk .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:.85rem;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
.msg.err{background:var(--warn-soft)}
.confirmbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:8px;background:var(--warn-soft)}
td .shin{width:110px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lab{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.tile .big{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15}
.tile .big small{font-size:.9rem;font-weight:500;color:var(--muted)}
.tile .sub{font-size:.85rem;color:var(--muted)}
.tile.risk{border-color:color-mix(in srgb,var(--sc,var(--warn)) 55%,var(--line));background:color-mix(in srgb,var(--sc,var(--warn)) 8%,var(--surface))}
.tile.risk .big{font-size:1.3rem;color:var(--fg)}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hardtag{display:inline-block;font-size:.72rem;padding:0 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-left:6px;vertical-align:1px}
.tnames{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 12px;margin-top:8px}
.tnames label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.tnames input{flex:1;min-width:0;font:inherit;font-size:.88rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.tnames button{font-size:.72rem;padding:1px 7px;border-radius:99px;border:0;background:var(--warn-soft);color:var(--warn);cursor:pointer;white-space:nowrap}
tr.tnrow td{padding-top:0;background:var(--bg)}
.foot{display:flex;justify-content:center;padding-top:8px}
.fbq{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.fbq .opts{display:flex;flex-wrap:wrap;gap:6px}
.fbq .opts label{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:.9rem;background:var(--bg)}
.fbq .opts input{accent-color:var(--accent)}
.fbq .opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.fbq textarea{font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:80px;resize:vertical}
a.btn{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

function freeSlots(date,fromMin){
  const st=S.settings,wd=pd(date).getDay(),we=wd===0||wd===6;
  const ws=toMin(we?st.weStart:st.wdStart),wE=toMin(we?st.weEnd:st.wdEnd);
  const b=[[12*60,13*60],[18*60,19*60]];
  classesOn(date).forEach(k=>b.push([toMin(k.s)-15,toMin(k.e)+15]));
  active().forEach(s=>{const x=S.subjects[s.c];if(x.exam===date)b.push([toMin(x.et)-30,toMin(x.ee)+30])});
  if(fromMin!=null)b.push([0,Math.ceil(fromMin/5)*5]);
  b.sort((p,q)=>p[0]-q[0]);
  const out=[];let t=ws;
  const fill=(a,z)=>{let u=a;while(u+st.slot<=z){out.push([u,u+st.slot]);u+=st.slot+st.brk}};
  for(const[a,z]of b){if(a>t)fill(t,Math.min(a,wE));t=Math.max(t,z)}
  if(t<wE)fill(t,wE);
  return out;
}

function generate(){
  const {date:today,min:nowMin}=nowInfo();
  const keep=S.plan.filter(x=>x.date<today||(x.date===today&&(x.done||x.s<nowMin))||(x.pinned&&S.subjects[x.code]?.on));
  const live=x=>x.done||(x.pinned&&(x.date>today||(x.date===today&&x.e>=nowMin)));
  const used={};active().forEach(s=>used[s.c]={learn:0,practice:0,mock:0});
  keep.forEach(x=>{if(live(x)&&used[x.code])used[x.code][x.kind]++});
  const reviewLoad={};
  const addReviews=(x)=>[1,3,7].forEach(k=>{const d=addD(x.date,k);if(d<=S.subjects[x.code].exam)reviewLoad[d]=(reviewLoad[d]||0)+1});
  keep.forEach(x=>{if(x.kind==='learn'&&live(x))addReviews(x)});
  const fresh=[],end=lastExam();
  for(let d=today;d<=end;d=addD(d,1)){
    const wd=pd(d).getDay(),we=wd===0||wd===6;
    const keptToday=keep.filter(x=>x.date===d);
    let slots=freeSlots(d,d===today?nowMin:null).filter(([a,z])=>!keptToday.some(k=>a<k.e&&z>k.s));
    const cap=Math.max(0,capFor(d)-keptToday.length);
    slots=slots.slice(0,cap);
    let prev=null;
    for(const[a,z]of slots){
      const at=dIdx(d)*1440+a;let best=null,bs=0;
      for(const s of active()){
        const x=S.subjects[s.c],ex=examAbs(s.c);
        if(at+S.settings.slot+60>ex)continue;
        const r=required(s.c),u=used[s.c],rem=r.total-u.learn-u.practice-u.mock;
        if(rem<=0)continue;
        const left=Math.max(.3,(ex-at)/1440);
        let sc=(s.cr+1)*(6-x.conf)*rem/left;
        if(left<=1.3)sc*=5;
        if(prev===s.c)sc*=.35;
        if(sc>bs){bs=sc;best=s.c}
      }
      if(!best)continue;
      const r=required(best),u=used[best],left=(examAbs(best)-at)/1440,eve=left<=1.3;
      let kind;
      if(eve)kind=u.mock<r.mock?'mock':u.practice<r.practice?'practice':'learn';
      else kind=u.learn<r.learn?'learn':u.practice<r.practice?'practice':'mock';
      u[kind]++;
      const x={id:d+'-'+a,date:d,s:a,e:z,code:best,kind,eve,topic:kind==='learn'?u.learn:null,focus:kind==='practice'?focusFor(best,u.practice):null,done:false};
      if(kind==='learn')addReviews(x);
      fresh.push(x);prev=best;
    }
  }
  S.plan=[...keep,...fresh].sort((p,q)=>p.date<q.date?-1:p.date>q.date?1:p.s-q.s);
  save();
}

}

function viewPlan(){
  if(!S.subjList.length)return welcome();
  const {date:today}=nowInfo();
  const cov=active().map(s=>{
    const r=required(s.c),pl=S.plan.filter(x=>x.code===s.c&&(x.done||x.date>=today)).length,dn=S.plan.filter(x=>x.code===s.c&&x.done).length;
    const gap=r.total-pl;
    return `<tr><td><span class="sw" style="background:${col(s.c)}"></span> ${esc(s.sh)}</td><td class="mono">${thDate(S.subjects[s.c].exam)}</td><td class="mono">${r.total}</td><td class="mono">${pl}</td><td class="mono">${dn}</td><td>${gap>0?`<span class="bad">ขาด ${gap} ช่วง</span>`:'<span class="ok">ครบ</span>'}</td></tr>`;
  }).join('');
  let days='';
  for(let d=today;d<=lastExam();d=addD(d,1)){
    const sl=S.plan.filter(x=>x.date===d&&S.subjects[x.code]?.on),cnt={};
    sl.forEach(x=>cnt[x.code]=(cnt[x.code]||0)+1);
    const ex=active().filter(s=>S.subjects[s.c].exam===d).map(s=>`<span class="pchip ex">สอบ ${esc(s.sh)}</span>`).join('');
    days+=`<div class="planday"><div class="small mono">${thDate(d)}</div><div class="chips">${ex}${Object.entries(cnt).map(([c,n])=>`<span class="pchip"><span class="sw" style="background:${col(c)}"></span>${esc(M(c).sh)} ×${n}</span>`).join('')||(ex?'':'<span class="muted small">พัก</span>')}</div></div>`;
  }
  const total=S.plan.filter(x=>x.date>=today).length;
  return `<div class="section"><h2>ความครอบคลุมแต่ละวิชา</h2><p class="small muted" style="margin:0">จำนวนช่วง (ช่วงละ ${S.settings.slot} นาที) ที่ควรใช้ คำนวณจากจำนวนบท ความมั่นใจ และหน่วยกิต ถ้าขาด ให้เพิ่มชั่วโมงอ่านต่อวันในแท็บตั้งค่า</p>

  <div class="section"><h2>รายวัน <span class="muted small">รวม ${total} ช่วง · ${Math.round(total*S.settings.slot/60)} ชม.</span></h2><div>${days}</div></div>
  <div class="section small muted"><b style="color:var(--fg)">วิธีจัด:</b> ทุกช่วงว่าง ระบบเลือกวิชาที่ได้คะแนนสูงสุดจาก (หน่วยกิต+1) × (6 − ความมั่นใจ) × งานที่เหลือ ÷ วันที่เหลือก่อนสอบ วิชาที่สอบใกล้ ไม่มั่นใจ และเหลือเยอะจะขึ้นก่อน ไม่ให้วิชาเดียวกันติดกันถ้าเลี่ยงได้ และวันก่อนสอบจะเน้นข้อสอบเก่าของวิชานั้น</div>`;

const encodeBk=()=>'S2P1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function decodeBk(txt){
  txt=(txt||'').trim();if(!txt)throw new Error('ยังไม่ได้วางรหัส');
  let obj;
  if(txt.startsWith('{'))obj=JSON.parse(txt);
  else{const m=txt.replace(/\s+/g,'').match(/S2P1:([A-Za-z0-9+/=]+)/);if(!m)throw new Error('รหัสไม่ถูกต้อง ต้องขึ้นต้นด้วย S2P1:');
    obj=JSON.parse(decodeURIComponent(escape(atob(m[1]))));}
  const n=normalize(obj);if(!n)throw new Error('ไม่ใช่ข้อมูลของ Sand To Pharmacist');
  return n;
}
function stageImport(txt){
  try{const n=decodeBk(txt);pendingImport={data:n,st:stats(n)};bkMsg=null}
  catch(e){pendingImport=null;bkMsg={t:'นำเข้าไม่ได้: '+(e.message||'รหัสไม่สมบูรณ์ ลองคัดลอกใหม่ให้ครบ'),err:true}}
  render();
}

function fbText(){
  const g=n=>{const e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:'-'};
  const t=($('fb-t')||{}).value||'';
  const {date:today}=nowInfo(),days=dIdx(today)-dIdx(S.since||today)+1;
  const done=S.plan.filter(x=>x.done).length,hard=active().reduce((a,s)=>a+hardTopics(s.c).length,0);
  return `[Sand To Pharmacist ความเห็น]\nช่วยให้อ่านตามแผนได้ (1-5): ${g('fb1')}\nเทอมหน้าจะใช้อีก: ${g('fb2')}\nยอมจ่ายต่อเทอม: ${g('fb3')}\nอยากให้ปรับ: ${t.trim()||'-'}\n---\nใช้มาแล้ว ${days} วัน · ${S.subjList.length} วิชา · ติ๊กแล้ว ${done} ช่วง · บทยาก ${hard} บท`;
}
function fbUpdate(){const a=$('fb-line');if(a)a.href='https://line.me/R/share?text='+encodeURIComponent(fbText())}
function viewFb(){
  const q=(name,label,opts)=>`<div class="fbq"><b>${label}</b><div class="opts">${opts.map((o,i)=>`<label><input type="radio" name="${name}" id="${name}-${i}" value="${o}">${o}</label>`).join('')}</div></div>`;
  return `<div class="section"><h2>ส่งความเห็นเกี่ยวกับแอป</h2><p class="small muted" style="margin:0">ใช้เวลาไม่ถึง 1 นาที ความเห็นของคุณช่วยตัดสินว่าจะพัฒนาอะไรต่อ ข้อความจะแนบสถิติการใช้งานคร่าว ๆ ไปด้วย (จำนวนวัน วิชา และช่วงที่ติ๊ก) ไม่มีชื่อหรือข้อมูลส่วนตัว</p>
  ${FEEDBACK_FORM?`<div class="fbq"><b>ตอบแบบสอบถามออนไลน์</b><a class="btn primary" href="${esc(FEEDBACK_FORM)}" target="_blank" rel="noopener">เปิดแบบสอบถาม</a></div>`:''}
  ${q('fb1','1. แอปช่วยให้อ่านตามแผนได้แค่ไหน',['1 ไม่ช่วยเลย','2','3','4','5 ช่วยมาก'])}
  ${q('fb2','2. เทอมหน้าจะใช้อีกไหม',['ใช้แน่นอน','อาจจะ','ไม่ใช้'])}
  ${q('fb3','3. ถ้ามีเวอร์ชันพิเศษ (สำรองบนคลาวด์ ใช้หลายเครื่อง สถิติ) ยอมจ่ายต่อเทอมเท่าไร',['ไม่จ่าย ใช้ฟรีพอ','29 บาท','49 บาท','99 บาท'])}
  <div class="fbq"><b>4. อยากให้ปรับหรือเพิ่มอะไร</b><textarea id="fb-t" placeholder="เช่น อยากให้แจ้งเตือนก่อนถึงเวลาอ่าน"></textarea></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="btn primary" id="fb-line" href="#" target="_blank" rel="noopener">ส่งทาง LINE</a><button class="btn" data-act="fbcopy">คัดลอกข้อความ</button><span class="small" id="fb-msg" style="color:var(--accent)"></span></div>
  <p class="small muted" style="margin:0">กด “ส่งทาง LINE” แล้วเลือกแชตที่จะส่ง เช่น กลุ่มเพื่อนที่ทดลองใช้ หรือคนที่ชวนคุณมาใช้แอปนี้</p></div>`;
}
function render(){
  header();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('view').innerHTML=tab==='day'?viewDay():tab==='plan'?viewPlan():tab==='subj'?viewSubj():tab==='fb'?viewFb():viewSched();
  if(tab==='fb')fbUpdate();
  const a=document.querySelector('.day[aria-pressed="true"]');if(a)a.scrollIntoView({block:'nearest',inline:'center'});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.go){tab=t.dataset.go;render();return}
  if(t.dataset.day){sel=t.dataset.day;render();return}
  if(t.dataset.tick){const x=S.plan.find(p=>p.id===t.dataset.tick),{date:today,min}=nowInfo();x.done=!x.done;if(!x.done)x.rating=null;
    // ติ๊กย้อนหลัง: จัดแผนข้างหน้าใหม่ เพื่อไม่ให้มีงานซ้ำที่ทำไปแล้ว
    if(x.date<today||(x.date===today&&x.e<min))generate();else save();render();return}
  if(t.dataset.rate){
    const x=S.plan.find(p=>p.id===t.dataset.id),sub=S.subjects[x.code],old=x.rating;
    const delta={easy:.25,ok:0,hard:-.5};
    if(old)sub.conf-=delta[old];
    x.rating=old===t.dataset.rate?null:t.dataset.rate;
    if(x.rating)sub.conf+=delta[x.rating];
    sub.conf=Math.max(1,Math.min(5,sub.conf));
    sub.topicRate=sub.topicRate||{};
    if(x.kind==='learn'&&x.topic){if(x.rating)sub.topicRate[x.topic]=x.rating;else delete sub.topicRate[x.topic]}
    if(x.kind==='practice'&&x.focus&&x.rating==='easy')sub.topicRate[x.focus]='ok';
    generate();render();return}
  if(t.dataset.cancel){S.exceptions.push({id:uid(),type:'cancel',ref:t.dataset.cancel,date:sel});generate();render();return}
  if(t.dataset.uncancel){S.exceptions=S.exceptions.filter(x=>!(x.type==='cancel'&&x.ref===t.dataset.uncancel&&x.date===sel));generate();render();return}
  if(t.dataset.delex){S.exceptions=S.exceptions.filter(x=>x.id!==t.dataset.delex);generate();render();return}
  if(t.dataset.delk){S.classes=S.classes.filter(k=>k.id!==t.dataset.delk);S.exceptions=S.exceptions.filter(x=>x.ref!==t.dataset.delk);generate();render();return}
  if(t.dataset.cap){S.dayCap[sel]=Math.max(0,Math.min(14,capFor(sel)+ +t.dataset.cap));generate();render();return}
  if(t.dataset.delslot){const n=S.plan.filter(x=>x.date===sel).length;S.plan=S.plan.filter(x=>x.id!==t.dataset.delslot);S.dayCap[sel]=Math.max(0,Math.min(capFor(sel),n-1));generate();render();return}
  if(t.dataset.unhard){const sub=S.subjects[t.dataset.unhard];if(sub&&sub.topicRate)sub.topicRate[t.dataset.tno]='ok';openTN=t.dataset.unhard;generate();render();return}
  const act=t.dataset.act;
  if(act==='fbcopy'){const txt=fbText(),m=$('fb-msg');const ok=()=>{if(m)m.textContent='คัดลอกแล้ว นำไปวางในแชตได้เลย'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{if(m)m.textContent='คัดลอกอัตโนมัติไม่ได้ ลองกดส่งทาง LINE แทน'});return}
  if(act==='capreset'){delete S.dayCap[sel];generate();render();return}
  if(act==='addown'){const c=$('o-c').value,st=$('o-s').value;if(!c||!st)return;const a=toMin(st),{kind,topic}=nextKind(c);
    const n=S.plan.filter(x=>x.date===sel).length;
    S.plan.push({id:uid(),date:sel,s:a,e:a+S.settings.slot,code:c,kind,topic,eve:false,done:false,pinned:true});
    S.dayCap[sel]=Math.max(capFor(sel),n+1);generate();render();return}
  if(act==='addk'){S.classes.push({id:uid(),d:1,s:'08:00',e:'09:00',c:S.subjList[0]?.c||''});save();render();return}
  if(act==='startadd'){tab='subj';showAdd=true;render();setTimeout(()=>{const i=$('n-th');if(i)i.focus()},0);return}
  if(act==='loadsample'){S=sample();sel=nowInfo().date;generate();render();return}
  if(act==='clearsample'){S=blank();save();tab='subj';showAdd=true;render();return}
  if(act==='delno'){confirmDel=null;render();return}
  if(act==='addsubj'){
    const th=$('n-th').value.trim(),sh=$('n-sh').value.trim(),exam=$('n-exam').value,et=$('n-et').value||'09:00',ee=$('n-ee').value||'12:00';
    let c=$('n-c').value.trim();
    if(!th){$('n-msg').textContent='ใส่ชื่อวิชาก่อน';return}
    if(!exam){$('n-msg').textContent='ใส่วันสอบก่อน';return}
    if(ee<=et){$('n-msg').textContent='เวลาสอบเสร็จต้องหลังเวลาเริ่ม';return}
    if(!c)c='S'+uid().slice(1,7);
    if(hasS(c)){$('n-msg').textContent='มีวิชารหัสนี้แล้ว';return}
    const used=new Set(S.subjList.map(x=>x.ci));let ci=0;while(used.has(ci)&&ci<11)ci++;if(used.has(ci))ci=S.subjList.length%12;
    S.subjList.push({c,th,sh:sh||(th.length>14?th.slice(0,14)+'…':th),cr:+$('n-cr').value||3,ci,auto:!$('n-c').value.trim()});
    S.subjects[c]={exam,et,ee,real:true,topics:Math.max(1,+$('n-tp').value||1),conf:+$('n-cf').value||3,on:true};
    S.sample=false;showAdd=true;generate();render();
    const m=$('n-msg');if(m){m.style.color='var(--accent)';m.textContent=`เพิ่ม ${th} แล้ว เพิ่มวิชาต่อไปได้เลย`}
    return}
  if(act==='bkcopy'){bkCode=encodeBk();const done=()=>{bkMsg={t:'คัดลอกรหัสสำรองแล้ว นำไปวางใน LINE หรือโน้ตได้เลย'};render()};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(bkCode).then(done,()=>{bkMsg={t:'คัดลอกอัตโนมัติไม่ได้ กดค้างที่ช่องรหัสแล้วเลือกคัดลอก'};render();const o=$('bk-out');if(o){o.focus();o.select()}});
    else{bkMsg={t:'กดค้างที่ช่องรหัสแล้วเลือกคัดลอก'};render();const o=$('bk-out');if(o){o.focus();o.select()}}
    return}
  if(act==='bkfile'){try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=`sand2pharm-${nowInfo().date}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
    bkMsg={t:'บันทึกไฟล์แล้ว ดูได้ในโฟลเดอร์ดาวน์โหลด ถ้าไม่มีไฟล์ ให้ใช้ปุ่มคัดลอกรหัสสำรองแทน'}}catch(e){bkMsg={t:'บันทึกไฟล์ไม่ได้ ใช้ปุ่มคัดลอกรหัสสำรองแทน',err:true}}render();return}
  if(act==='bkcheck'){stageImport($('bk-in').value);return}
  if(act==='impno'){pendingImport=null;render();return}
  if(act==='impyes'){try{localStorage.setItem(KEY+'-before-import',JSON.stringify(S))}catch(e){}
    S=pendingImport.data;pendingImport=null;sel=nowInfo().date;generate();bkMsg={t:'นำเข้าข้อมูลแล้ว'};render();return}
  if(act==='impundo'){let p=null;try{p=normalize(JSON.parse(localStorage.getItem(KEY+'-before-import')));localStorage.removeItem(KEY+'-before-import')}catch(e){}
    if(p){S=p;generate();bkMsg={t:'ย้อนกลับเป็นข้อมูลเดิมแล้ว'}}render();return}
  if(act==='addextra'){const c=$('x-c').value,st=$('x-s').value,en=$('x-e').value;if(!st||!en||en<=st)return;
    S.exceptions.push({id:uid(),type:'extra',date:sel,s:st,e:en,c,label:c?'':($('x-label').value.trim()||'นัดพิเศษ')});generate();render();return}
  if(act==='replan'){const {date:today,min}=nowInfo();S.plan.forEach(x=>{if(!x.done&&(x.date<today||(x.date===today&&x.e<min)))x.moved=true});generate();render()}
  if(t.dataset.askdel){confirmDel=t.dataset.askdel;render();return}
  if(t.dataset.delsubj){const c=t.dataset.delsubj;S.subjList=S.subjList.filter(x=>x.c!==c);delete S.subjects[c];S.plan=S.plan.filter(x=>x.code!==c);S.classes.forEach(k=>{if(k.c===c)k.c=''});confirmDel=null;generate();render();return}
  if(t.dataset.confirm){S.subjects[t.dataset.confirm].real=true;save();render();return}
  if(act==='reset'){confirmReset=true;render()}
  if(act==='reset-no'){confirmReset=false;render()}
  if(act==='reset-yes'){confirmReset=false;S=blank();save();sel=nowInfo().date;tab='day';render()}
});
document.addEventListener('input',e=>{if(tab==='fb')fbUpdate()});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.tnbox){if(d.open)openTN=d.dataset.tnbox;else if(openTN===d.dataset.tnbox)openTN=null}},true);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.stime||t.dataset.ssubj){const x=S.plan.find(p=>p.id===(t.dataset.stime||t.dataset.ssubj));if(!x||!t.value)return;
    if(t.dataset.stime){const a=toMin(t.value);x.s=a;x.e=a+S.settings.slot}
    else{x.code=t.value;Object.assign(x,nextKind(x.code,x.id));x.eve=false}
    x.id=uid();x.pinned=true;S.dayCap[x.date]=Math.max(capFor(x.date),S.plan.filter(p=>p.date===x.date).length);generate();render();return}
  if(t.dataset.capday){S.settings.capDays[+t.dataset.capday]=Math.max(0,Math.min(14,+t.value||0));generate();render();return}
  if(t.dataset.k){const k=S.classes.find(x=>x.id===t.dataset.k),f=t.dataset.kf;
    if(f==='d')k.d=+t.value;else if(f==='label')k.label=t.value;else if(f==='c')k.c=t.value;else if(t.value)k[f]=t.value;
    generate();render();return}
  if(t.id==='bk-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>stageImport(String(r.result));r.readAsText(t.files[0]);t.value='';return}
  if(t.dataset.m==='sh'){const m=S.subjList.find(x=>x.c===t.dataset.c);if(m&&t.value.trim())m.sh=t.value.trim();save();render();return}
  if(t.dataset.tn){const sub=S.subjects[t.dataset.tn];sub.topicNames=sub.topicNames||[];sub.topicNames[+t.dataset.ti]=t.value.trim();openTN=t.dataset.tn;save();return}
  if(t.name&&t.name.startsWith('fb')){fbUpdate();return}
  if(t.dataset.recall){S.recall[t.dataset.recall]=t.checked;save();return}
  if(t.dataset.f){
    const x=S.subjects[t.dataset.c],f=t.dataset.f;
    if(f==='on')x.on=t.checked;else if(f==='topics')x.topics=Math.max(1,+t.value||1);else if(f==='conf')x.conf=+t.value;else if(t.value)x[f]=t.value;
    if(f==='exam')x.real=true;
    generate();render();return}
  if(t.dataset.s){
    const k=t.dataset.s;if(!t.value&&k!=='classEnd')return;
    S.settings[k]=t.type==='number'?Math.max(0,+t.value):t.value;
    generate();render()}
});

if(S.subjList.length&&!S.plan.length)generate();
render();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
let deferredPrompt=null;const ib=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;ib.hidden=false});
ib.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.hidden=true});
window.addEventListener('appinstalled',()=>{ib.hidden=true});
</script>
